name: Build and Deploy Azure Container Apps

on: # El trigger es igual, en cada push a la rama main se va a disparar.
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar el workflow manualmente desde la interfaz de GitHub Actions.

permissions:
  contents: read
  id-token: write

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Staging  # Indicamos donde estan las variables de entorno, en este caso en el entorno Staging.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: # Necesitamos estos secrets para poder hacer login en Docker Hub y poder subir la imagen. Los tenemso que crear en github secrets.  
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
       # Action para construir y subir la imagen a Docker Hub. La imagen se construye a partir del Dockerfile que tenemos en la carpeta deployment.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with: # Le decimos donde esta el Dockerfile y que queremos subir la imagen a Docker Hub con el tag latest.
          context: ./deployment
          file: ./deployment/Dockerfile
          push: true
          tags: # Necesitamos una variable de entorno en github que se llame DOCKERHUB_REPO y otra IMAGE_NAME, que son el nombre de usuario de Docker Hub y el nombre de la imagen respectivamente.
            ${{ vars.DOCKERHUB_REPO }}/${{ vars.IMAGE_NAME }}:latest

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Verify Container App  # Recurso de Azure Container Apps que vamos a actualizar, para verificar que existe y que tenemos permisos para acceder a el.
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "{name:name, resourceGroup:resourceGroup, id:id}" \
            --output json

      - name: Configure application secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_URL }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          MODEL_URI: ${{ vars.MODEL_URI }}
        run: |
          set -euo pipefail

          az containerapp secret set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              "azure-tenant-id=$AZURE_TENANT_ID" \
              "azure-client-id=$AZURE_CLIENT_ID" \
              "azure-client-secret=$AZURE_CLIENT_SECRET"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "AZURE_TENANT_ID=secretref:azure-tenant-id" \
              "AZURE_CLIENT_ID=secretref:azure-client-id" \
              "AZURE_CLIENT_SECRET=secretref:azure-client-secret" \
              "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI" \
              "MODEL_URI=$MODEL_URI"

      - name: Configure private Docker Hub registry
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          az containerapp registry set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --server index.docker.io \
            --username "$DOCKER_USER" \
            --password "$DOCKER_TOKEN"

      - name: Deploy to Azure Container Apps
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          IMAGE="docker.io/${DOCKER_USER}/${IMAGE_NAME}:latest"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
