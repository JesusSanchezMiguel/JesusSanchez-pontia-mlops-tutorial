name: Integration

on: # Este workflow se ejecuta cuando se hace un push a la rama main o cuando se abre un pull request hacia la rama main v
  pull_request:

jobs:
  integrate:
    runs-on: ubuntu-latest
    # Le decimos que utilice el environment Staging que hemos creado en github, para que se ejecute el workflow dentro de ese entorno
    environment: Staging
    permissions:
      contents: read
      pull-requests: write
   #
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

        # Metemos el paso de descargar el dataset de entrenamiento dentro del workflow de build, para que se ejecute cada vez que se haga push a la rama main           
      - name: Download and extract dataset         
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./data/raw

          curl -fL \
            "https://archive.ics.uci.edu/static/public/20/census+income.zip" \
            -o /tmp/census-income.zip          
          unzip -o /tmp/census-income.zip -d ./data/raw   

          rm /tmp/census-income.zip

          echo "Dataset extracted to ./data/raw"
          find ./data -maxdepth 2 -type f     
       # Y nos descargamos el modelo que hemos entrenado en el workflow de build, para poder ejecutar los tests con el modelo ya entrenado
      - name: Download Model
        run: |
          python scripts/download_model.py
        env:
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          MLFLOW_URI: ${{vars.MLFLOW_URL}}
          EXPERIMENT_NAME: ${{vars.EXPERIMENT_NAME}}


      - name: Run tests and save exit code
        id: tests
        # Ejecutamos los tests y guardamos el código de salida en una variable de entorno para poder usarlo en el siguiente paso
        run: |
            mkdir -p test-results
            PYTHONPATH=./src pytest tests/ --capture=tee-sys --cov=model --cov-report=term --cov-report=html --junitxml=test-results/results.xml > test-results/results.log

        # Este paso publica un comentario en la pull request con los resultados de los tests y la cobertura de código, incluso si los tests fallan
      - name: Comment test results and coverage on PR
        uses: actions/github-script@v7
        # El if: always() asegura que este paso se ejecute incluso si los tests fallan, para que siempre se publiquen los resultados en la pull request
        if: always()
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('test-results/results.log', 'utf8');
            const truncated = results.length > 65000 ? results.slice(0, 65000) + '\\n...TRUNCATED...' : results;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Test Results with Coverage\n\n\`\`\`\n${truncated}\n\`\`\``
            });