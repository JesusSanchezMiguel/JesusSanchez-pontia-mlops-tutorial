name: Build Model

on: # Se nos va a ejecutar el workflow cuando se haga push a la rama main
  push:
    branches:
      - main  
# 
permissions:
  contents: write

jobs:
  build: # Nombre del job simplemente lo llamamos build
    runs-on: ubuntu-latest # La maquina que vamos a usar para ejecutar el workflow dentro de github actions
    # Staging es el nombre que hemos puesto a nuestro environment dentro del github
    environment: Staging # Nombre del entorno que vamos a usar para ejecutar el workflow dentro de github actions
    steps:      
      - name: Checkout code 
        uses: actions/checkout@v3 # Nos clona el repositorio en la maquina virtual que se va a ejecutar el workflow

      - name: Set up Python
        uses: actions/setup-python@v5 # configuramos la version de python que vamos a usar ()es un action creado por una persona
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: | # barra vertical indica que vamos a ejecutar varios comandos en la misma linea. Vamos a ejecutar el pip install y el requirements.txt             
          python -m pip install --upgrade pip  
          pip install -r requirements.txt   

      # Metemos el paso de descargar el dataset de entrenamiento dentro del workflow de build, para que se ejecute cada vez que se haga push a la rama main           
      - name: Download and extract dataset         
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./data/raw

          curl -fL \
            "https://archive.ics.uci.edu/static/public/20/census+income.zip" \
            -o /tmp/census-income.zip          
          unzip -o /tmp/census-income.zip -d ./data/raw   

          rm /tmp/census-income.zip

          echo "Dataset extracted to ./data/raw"
          find ./data -maxdepth 2 -type f

      - name: Train and save model
        run: | # Ejecutamos nuestro programa principal que entrena el modelo y lo guarda en la carpeta models
          python src/main.py
        # Añadimos nuestras variables de entorno para poder publicar el modelo en mlflow . dd
        env:
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          MLFLOW_URI: ${{ vars.MLFLOW_URL }}
          EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}


      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: model.pkl
          path: ./models/model.pkl
          retention-days: 30
